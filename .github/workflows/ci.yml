name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Also copies the pdf.js worker into public/ via postinstall, so the build below
      # exercises the same worker-sync path a contributor gets locally.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build static export
        run: bun run build

      # The README promises the app works offline. That promise is only true if the service
      # worker was generated and actually precached every tool shell, the pdf.js worker and
      # the merge worker — none of which a passing build would tell us on its own.
      - name: Check the offline bundle is complete
        run: node scripts/check-offline-bundle.mjs

      # pdf-lib and pdf.js are meant to arrive lazily. A single top-level import anywhere the
      # UI can reach undoes that, and the only symptom is a slower first paint.
      - name: Check the first-load bundle
        run: node scripts/check-bundle.mjs

      # The worker must match the installed pdfjs-dist exactly — a drift here makes pdf.js
      # throw "The API version X does not match the Worker version Y" at runtime, which no
      # amount of building would surface.
      - name: Check the committed pdf.js worker is in sync
        run: |
          bun run copy-pdf-worker
          git diff --exit-code -- public/pdf.worker.min.js
